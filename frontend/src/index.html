  <style data-purpose="custom-broadcast-styles">
    /* Custom scanline and broadcast monitor styling */
    .crt-grid {
      background-size: 20px 20px;
      background-image: 
        linear-gradient(to right, rgba(255, 98, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 98, 0, 0.04) 1px, transparent 1px);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #0d0f14;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #2b3342;
      border-radius: 2px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #ff6200;
    }
    /* Discrete LED segments */
    .led-bar {
      box-shadow: inset 0 0 4px rgba(0,0,0,0.8);
    }
